<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Sentiment Analysis Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <header class="auth-header">
        <h1>Create Account</h1>
        <p>Start running text & sentiment analysis</p>
      </header>

      <form id="register-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="johndoe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Create Account</button>
      </form>

      <footer class="auth-footer">
        <p>Already have an account? <a href="{{ url_for('login_page') }}">Log in</a></p>
      </footer>
    </section>
  </main>
</body>
</html>
