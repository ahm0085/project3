<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sentiment Analysis Platform</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <header class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to access your analysis tools</p>
      </header>

      <form id="login-form">
        <div class="form-group">
          <label for="identity">Email or Username</label>
          <input type="text" id="identity" name="identity" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <footer class="auth-footer">
        <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
      </footer>
    </section>
  </main>
</body>
</html>
