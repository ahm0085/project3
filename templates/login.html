<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SkillSync AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <header class="auth-header">
        <h1>Welcome Back</h1>
        <p>Log in to access your personalized learning recommendations</p>
      </header>

      <!-- Error Alert Container -->
      <div id="login-error" class="alert alert-danger d-none" role="alert" style="color: red; margin-bottom: 1rem;"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <footer class="auth-footer">
        <p>Don't have an account? <a href="{{ url_for('register_page') }}">Register here</a></p>
      </footer>
    </section>
  </main>

  <!-- Load Auth JavaScript Module -->
  <script type="module" src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
