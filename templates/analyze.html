<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyze - SkillSync AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const navMenu = document.getElementById('nav-menu');

      if (hamburgerBtn && navMenu) {
        hamburgerBtn.addEventListener('click', function () {
          navMenu.classList.toggle('active');
        });
      }
    });
  </script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="{{ url_for('courses_page') }}" class="nav-brand">SkillSync AI</a>
      <button class="hamburger" id="hamburger-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-menu">
        <li><a href="{{ url_for('courses_page') }}">Courses</a></li>
        <li><a href="{{ url_for('analyze_page') }}" class="active">Analyze</a></li>
        <li><a href="{{ url_for('history_page') }}">History</a></li>
        <li><a href="{{ url_for('profile_page') }}">Profile</a></li>
        <li><button id="logout-btn" class="btn-logout">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="grid-2col">
      <!-- Left Column: Input Form -->
      <section class="card">
        <h2>Submit Text for Skill Analysis</h2>
        <form id="analysis-form">
          <label for="text-input" class="sr-only">Input Text</label>
          <textarea id="text-input" name="text" placeholder="Paste text, career goals, or course feedback here..." required></textarea>
          <button type="submit" class="btn-primary">Analyze Text</button>
        </form>
      </section>

      <!-- Right Column: Results Display -->
      <section class="card" id="results-card">
        <h2>Analysis Results</h2>
        <article id="results-container">
          <p class="placeholder-text">Submit text on the left to view skill analysis metrics.</p>
        </article>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SkillSync AI. All rights reserved.</p>
  </footer>

  <!-- Load API and General JavaScript -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
</body>
</html>
