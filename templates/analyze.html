<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analyze - Sentiment Analysis Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="nav-brand">TextAnalyzer</div>
      <ul class="nav-links">
        <li><a href="{{ url_for('analyze_page') }}" class="active">Analyze</a></li>
        <li><a href="{{ url_for('history_page') }}">History</a></li>
        <li><a href="{{ url_for('profile_page') }}">Profile</a></li>
        <li><button id="logout-btn" class="btn-logout">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="grid-2col">
      <!-- Left Column: Input Form -->
      <section class="card">
        <h2>Submit Text for Analysis</h2>
        <form id="analysis-form">
          <label for="text-input" class="sr-only">Input Text</label>
          <textarea id="text-input" name="text" placeholder="Paste your text or feedback here..." required></textarea>
          <button type="submit" class="btn-primary">Analyze Text</button>
        </form>
      </section>

      <!-- Right Column: Results Display -->
      <section class="card" id="results-card">
        <h2>Analysis Results</h2>
        <article id="results-container">
          <p class="placeholder-text">Submit text on the left to see sentiment score and metrics.</p>
        </article>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Sentiment Analysis System</p>
  </footer>
</body>
</html>
