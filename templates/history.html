<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis History - Sentiment Analysis Tool</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="nav-brand">TextAnalyzer</div>
      <ul class="nav-links">
        <li><a href="{{ url_for('analyze_page') }}">Analyze</a></li>
        <li><a href="{{ url_for('history_page') }}" class="active">History</a></li>
        <li><a href="{{ url_for('profile_page') }}">Profile</a></li>
        <li><button id="logout-btn" class="btn-logout">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      <header>
        <h2>Analysis History</h2>
      </header>
      
      <!-- Filter controls -->
      <div class="filters" style="margin: 1rem 0;">
        <input type="text" id="search-filter" placeholder="Search text..." style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
      </div>

      <article>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Snippet</th>
              <th>Sentiment</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- Dynamically populated via JS JWT fetches -->
          </tbody>
        </table>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Sentiment Analysis System</p>
  </footer>
</body>
</html>
