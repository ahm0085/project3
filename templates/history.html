<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analysis History - SkillSync AI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const hamburgerBtn = document.getElementById('hamburger-btn');
      const navMenu = document.getElementById('nav-menu');

      if (hamburgerBtn && navMenu) {
        hamburgerBtn.addEventListener('click', function () {
          navMenu.classList.toggle('active');
        });
      }
    });
  </script>
</head>
<body>
  <header>
    <nav class="navbar">
      <a href="{{ url_for('courses_page') }}" class="nav-brand">SkillSync AI</a>
      <button class="hamburger" id="hamburger-btn">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <ul class="nav-links" id="nav-menu">
        <li><a href="{{ url_for('courses_page') }}">Courses</a></li>
        <li><a href="{{ url_for('analyze_page') }}">Analyze</a></li>
        <li><a href="{{ url_for('history_page') }}" class="active">History</a></li>
        <li><a href="{{ url_for('profile_page') }}">Profile</a></li>
        <li><button id="logout-btn" class="btn-logout">Logout</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="card">
      <header>
        <h2>Analysis History</h2>
      </header>
      
      <!-- Filter controls -->
      <div class="filters" style="margin: 1rem 0;">
        <input type="text" id="search-filter" placeholder="Search history..." style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
      </div>

      <article>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Snippet</th>
              <th>Score</th>
              <th>Date</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="history-table-body">
            <!-- Dynamically populated via JS JWT fetches -->
          </tbody>
        </table>
      </article>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 SkillSync AI. All rights reserved.</p>
  </footer>

  <!-- Load API and General JavaScript -->
  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
</body>
</html>
